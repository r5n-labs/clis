name: Create Stone from PR

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  create-stone:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Create stone from PR
        run: bunx @r5n/sisyphus pr --url ${{ github.event.pull_request.html_url }} --yes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push stone
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .sisyphus/stones/
          git diff --cached --quiet || git commit -m "chore: add stone from PR #${{ github.event.pull_request.number }}"
          git push
