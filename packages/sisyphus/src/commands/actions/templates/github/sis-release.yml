name: Release

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: sisyphus-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'sisyphus-release'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # pull_request:closed checks out an ephemeral merge ref; release tags must bind to the merged commit.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: oven-sh/setup-bun@v2

      - name: Resolve release state path
        run: echo "SIS_RELEASE_DIR=$(git rev-parse --git-path sisyphus/release)" >> "$GITHUB_ENV"

      # The cache key is sha-free and ref-stable so a workflow_dispatch recovery run
      # restores the state saved by the failed merge-triggered run.
      - name: Restore release state
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.SIS_RELEASE_DIR }}
          key: sisyphus-release-${{ runner.os }}-${{ github.event.pull_request.base.ref || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sisyphus-release-${{ runner.os }}-${{ github.event.pull_request.base.ref || github.ref_name }}-

      - name: Remove cached release lock
        run: rm -f "$SIS_RELEASE_DIR/.write.lock" "$SIS_RELEASE_DIR"/.write.lock.*.owner "$SIS_RELEASE_DIR"/.write.lock.*.claim

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install npm 11
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: bun install

      - name: Install Sisyphus
        run: bun add --global @r5n/sisyphus

      - name: Publish release
        run: |
          if [ -f "$SIS_RELEASE_DIR/active.json" ]; then
            sis roll --resume
          else
            sis roll --publish-only --yes
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Save release state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: ${{ env.SIS_RELEASE_DIR }}
          key: sisyphus-release-${{ runner.os }}-${{ github.event.pull_request.base.ref || github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
