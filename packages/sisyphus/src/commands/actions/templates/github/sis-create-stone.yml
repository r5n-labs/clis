name: Sisyphus - Handle PR Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  handle-merge:
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'sisyphus-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create stone from PR
        id: stone
        run: |
          OUTPUT=$(bunx @r5n/sisyphus pr --url ${{ github.event.pull_request.html_url }} --yes 2>&1) && EXIT_CODE=0 || EXIT_CODE=$?
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Skipping:"; then
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "skipped=false" >> $GITHUB_OUTPUT
            if [ $EXIT_CODE -ne 0 ]; then
              exit $EXIT_CODE
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push stone
        if: steps.stone.outputs.skipped == 'false'
        run: |
          git add .sisyphus/stones/
          git diff --cached --quiet || (git commit -m "chore: add stone from PR #${{ github.event.pull_request.number }}" && git push)

      - name: Create or update release PR
        if: steps.stone.outputs.skipped == 'false'
        run: bunx @r5n/sisyphus actions release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
