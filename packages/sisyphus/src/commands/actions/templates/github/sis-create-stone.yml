name: Sisyphus - Handle PR Merge

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: sisyphus-${{ github.ref }}
  cancel-in-progress: false

jobs:
  handle-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'sisyphus-release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Sisyphus
        run: bun add --global @r5n/sisyphus

      - name: Configure git
        run: |
          git config user.name "r5n-bot[bot]"
          git config user.email "r5n-bot[bot]@users.noreply.github.com"

      - name: Create stone from PR
        id: stone
        run: |
          OUTPUT=$(sis pr --url "${{ github.event.pull_request.html_url }}" --yes 2>&1) && EXIT_CODE=0 || EXIT_CODE=$?
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "Skipping:"; then
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped=false" >> "$GITHUB_OUTPUT"
            if [ "$EXIT_CODE" -ne 0 ]; then
              exit "$EXIT_CODE"
            fi
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push stone
        if: steps.stone.outputs.skipped == 'false'
        run: |
          git add .sisyphus/
          git diff --cached --quiet || (git commit -m "chore: add stone from PR #${{ github.event.pull_request.number }}" && git push)

      - name: Create or update release PR
        if: steps.stone.outputs.skipped == 'false'
        run: sis actions release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  handle-push:
    if: github.event_name == 'push' && github.event.head_commit.committer.username != 'web-flow'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Sisyphus
        run: bun add --global @r5n/sisyphus

      - name: Configure git
        run: |
          git config user.name "r5n-bot[bot]"
          git config user.email "r5n-bot[bot]@users.noreply.github.com"

      - name: Update release PR
        run: sis actions release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
