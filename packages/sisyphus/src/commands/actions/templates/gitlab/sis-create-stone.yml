handle-merge:
  stage: sisyphus
  image: oven/bun:alpine
  before_script: &sisyphus_before_script
    - apk add --no-cache git
    - |
      if [ -z "${GITLAB_TOKEN:-}" ]; then
        echo "Set GITLAB_TOKEN with api and write_repository access to create release merge requests" >&2
        exit 1
      fi
      export SIS_PUSH_TOKEN="${SIS_PUSH_TOKEN:-$GITLAB_TOKEN}"
      git remote set-url origin "${CI_SERVER_URL}/${CI_PROJECT_PATH}.git"
      git config credential.helper ''
      git config --add credential.helper '!f() { echo "username=oauth2"; echo "password=${SIS_PUSH_TOKEN}"; }; f'
    - bun add --global @r5n/sisyphus
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch/ && $CI_COMMIT_TITLE !~ /sisyphus\/release/
  script:
    - |
      MR_IID=$(printf '%s\n' "$CI_COMMIT_DESCRIPTION" | awk -v prefix="See merge request ${CI_PROJECT_PATH}!" '
        index($0, prefix) == 1 {
          value = substr($0, length(prefix) + 1)
          sub(/[[:space:]]+$/, "", value)
          if (value ~ /^[0-9]+$/) iid = value
        }
        END { print iid }
      ')
      if [ -z "$MR_IID" ]; then
        echo "No MR IID found in commit description, skipping"
        exit 0
      fi
      echo "Detected MR !$MR_IID"
    - git fetch --unshallow || true
    - git config user.name "r5n-bot[bot]"
    - git config user.email "r5n-bot[bot]@users.noreply.gitlab.com"
    - bun install
    - |
      OUTPUT=$(sis pr --url "$CI_PROJECT_URL/-/merge_requests/$MR_IID" --yes 2>&1) && EXIT_CODE=0 || EXIT_CODE=$?
      echo "$OUTPUT"
      if echo "$OUTPUT" | grep -q "Skipping:"; then
        echo "Stone creation skipped"
        exit 0
      fi
      if [ $EXIT_CODE -ne 0 ]; then
        exit $EXIT_CODE
      fi
      git add .sisyphus/
      git diff --cached --quiet || git commit -m 'chore: add stone from MR !'"$MR_IID"
      git push origin "HEAD:$CI_DEFAULT_BRANCH"
      sis actions release-pr

handle-push:
  stage: sisyphus
  image: oven/bun:alpine
  before_script: *sisyphus_before_script
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE !~ /^Merge branch/
  script:
    - git fetch --unshallow || true
    - git config user.name "r5n-bot[bot]"
    - git config user.email "r5n-bot[bot]@users.noreply.gitlab.com"
    - bun install
    - sis actions release-pr
