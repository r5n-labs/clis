release:
  stage: sisyphus
  image: oven/bun:alpine
  resource_group: sisyphus-release
  cache:
    key: "sisyphus-release-$CI_COMMIT_SHA"
    policy: pull-push
    when: always
    paths:
      - .git/sisyphus/release/
  before_script:
    - apk add --no-cache git nodejs npm
    - rm -f .git/sisyphus/release/.write.lock .git/sisyphus/release/.write.lock.*.owner .git/sisyphus/release/.write.lock.*.claim
    - npm install --global npm@11.5.1
    - npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
    # release.tags / release.push need a push credential: CI_JOB_TOKEN cannot push, and Sisyphus
    # rejects the token-embedded checkout URL. Set SIS_PUSH_TOKEN (project access token with
    # write_repository scope) as a masked CI/CD variable to enable tag and branch pushes.
    - |
      if [ -n "$SIS_PUSH_TOKEN" ]; then
        git remote set-url origin "https://${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
        git config credential.helper '!f() { echo "username=oauth2"; echo "password=${SIS_PUSH_TOKEN}"; }; f'
      fi
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
      when: manual
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^Merge branch.*sisyphus\/release/
  script:
    - git fetch --unshallow || true
    - bun install
    - bun add --global @r5n/sisyphus
    - if [ -f .git/sisyphus/release/active.json ]; then sis roll --resume; else sis roll --publish-only --yes; fi
