name: Security

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Configure and checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run audit
        run: |
          # Bun doesn't have built-in audit yet, so we use npm audit on the lockfile
          if command -v npm &> /dev/null; then
            npm audit --audit-level=moderate || true
          fi

  codeql:
    name: CodeQL Analysis
    runs-on: r5n-m2-ultra
    strategy:
      matrix:
        language: ['typescript', 'javascript']
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Configure and checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  secrets:
    name: Secret Scanning
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Configure and checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  license:
    name: License Check
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Configure and checkout submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check licenses
        run: |
          # Basic license check - ensure no GPL/AGPL in dependencies
          echo "Checking for problematic licenses..."

          # This is a simple check - in production you might want to use license-checker
          if bun pm ls | grep -iE "(GPL|AGPL)" | grep -v "MIT"; then
            echo "Found potentially problematic licenses!"
            exit 1
          fi

          echo "License check passed!"
