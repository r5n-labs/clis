name: Release

on:
  push:
    branches: [main, develop]

concurrency:
  group: sisyphus-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: r5n-m2-ultra
    if: "!contains(github.event.head_commit.message, 'release(🎉):')"
    outputs:
      published: ${{ steps.roll.outputs.published }}
      publishedPackages: ${{ steps.roll.outputs.publishedPackages }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - name: Reset release state
        run: |
          RELEASE_DIR="$(git rev-parse --git-path sisyphus/release)"
          echo "SIS_RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          rm -rf "$RELEASE_DIR"

      - name: Restore release state
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.SIS_RELEASE_DIR }}
          key: sisyphus-release-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sisyphus-release-${{ github.run_id }}-

      - name: Remove cached release lock
        run: rm -f "$SIS_RELEASE_DIR/.write.lock" "$SIS_RELEASE_DIR"/.write.lock.*.owner "$SIS_RELEASE_DIR"/.write.lock.*.claim

      - uses: ./tools/github/setup
        with:
          bun: false

      - name: Build
        run: bun run build

      - name: Check for pending stones
        run: |
          if ! STONES_JSON=$(bun --bun packages/sisyphus/src/cli.ts check --json); then
            echo "ERROR: Sisyphus check failed"
            echo "$STONES_JSON"
            exit 1
          fi
          STONES_COUNT=$(echo "$STONES_JSON" | jq '.stones | length')
          echo "Found $STONES_COUNT pending stones"
          echo "STONES_COUNT=$STONES_COUNT" >> "$GITHUB_ENV"
          if [ "$STONES_COUNT" -gt 0 ] || [ -f "$SIS_RELEASE_DIR/active.json" ]; then
            echo "RELEASE_PENDING=true" >> "$GITHUB_ENV"
          else
            echo "RELEASE_PENDING=false" >> "$GITHUB_ENV"
          fi

      - name: Roll release
        id: roll
        if: env.RELEASE_PENDING == 'true'
        run: |
          set -eo pipefail
          NPM_DIR="$RUNNER_TEMP/npm11"
          npm install --prefix "$NPM_DIR" --no-fund --no-audit npm@11 >/dev/null
          export PATH="$NPM_DIR/node_modules/.bin:$PATH"
          npm --version
          REPORT="$RUNNER_TEMP/release.json"
          STATUS=0
          if [ -f "$SIS_RELEASE_DIR/active.json" ]; then
            bun sis roll --resume --json > "$REPORT" || STATUS=$?
          else
            bun sis roll --json --yes > "$REPORT" || STATUS=$?
          fi

          cat "$REPORT"
          jq -r '.warnings[]?' "$REPORT" 2>/dev/null | while IFS= read -r warning; do
            echo "::warning title=Sisyphus release::$warning"
          done || true

          PUBLISHED=$(jq -r '.published // false' "$REPORT" 2>/dev/null || echo false)
          PACKAGES=$(jq -c '.publishedPackages // []' "$REPORT" 2>/dev/null || echo '[]')
          {
            echo "published=$PUBLISHED"
            echo "publishedPackages<<SIS_JSON_EOF"
            echo "$PACKAGES"
            echo "SIS_JSON_EOF"
          } >> "$GITHUB_OUTPUT"

          exit "$STATUS"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          NPM_CONFIG_PROVENANCE: "false"
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"

      - name: Inspect release state
        id: release-state
        if: always()
        run: |
          if [ -f "$SIS_RELEASE_DIR/active.json" ] || ls "$SIS_RELEASE_DIR"/history/*.json >/dev/null 2>&1; then
            echo "save=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save release state
        if: always() && steps.release-state.outputs.save == 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.SIS_RELEASE_DIR }}
          key: sisyphus-release-${{ github.run_id }}-${{ github.run_attempt }}
