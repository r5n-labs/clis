name: Release

on:
  push:
    branches: [main, develop]

concurrency:
  group: sisyphus-release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: r5n-m2-ultra
    if: "!contains(github.event.head_commit.message, 'release(🎉):')"

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - uses: ./tools/github/setup
        with:
          bun: false

      - name: Build
        run: bun run build

      - name: Check for pending stones
        run: |
          if ! STONES_JSON=$(bun --bun packages/sisyphus/src/cli.ts check --json); then
            echo "ERROR: Sisyphus check failed"
            echo "$STONES_JSON"
            exit 1
          fi
          STONES_COUNT=$(echo "$STONES_JSON" | jq '.stones | length')
          echo "Found $STONES_COUNT pending stones"
          echo "STONES_COUNT=$STONES_COUNT" >> $GITHUB_ENV

      # The release validates that no gitignored build inputs exist outside node_modules and rebuilds per package itself.
      - name: Remove prebuilt publish outputs
        if: env.STONES_COUNT != '0'
        run: rm -rf packages/*/dist

      - name: Roll release
        if: env.STONES_COUNT != '0'
        run: |
          NPM_DIR="$RUNNER_TEMP/npm11"
          npm install --prefix "$NPM_DIR" --no-fund --no-audit npm@11 >/dev/null
          export PATH="$NPM_DIR/node_modules/.bin:$PATH"
          npm --version
          RELEASE_DIR="$(git rev-parse --git-path sisyphus/release)"
          if [ -f "$RELEASE_DIR/active.json" ]; then
            bun sis roll --resume
          else
            bun release:roll
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_ENV: production
          NPM_CONFIG_PROVENANCE: "false"
          NPM_CONFIG_REGISTRY: "https://registry.npmjs.org/"
