name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  BUN_VERSION: "1.3.14"

jobs:
  lint:
    name: Lint
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun lint

  typecheck:
    name: Type Check
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun type-check

  test:
    name: Test
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test --pass-with-no-tests

  build:
    name: Build
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Verify CLI executables
        run: |
          # Verify Hydra
          ./packages/hydra/dist/cli.js --version

          # Verify Sisyphus
          ./packages/sisyphus/dist/cli.js --version

          # Verify Atlas
          ./packages/atlas/dist/cli.js --version

  integration:
    name: Integration Tests
    needs: build
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run build

      - name: Test Hydra CLI
        run: |
          chmod +x packages/hydra/dist/cli.js
          ./packages/hydra/dist/cli.js --help
          ./packages/hydra/dist/cli.js --version

      - name: Test Sisyphus CLI
        run: |
          chmod +x packages/sisyphus/dist/cli.js
          ./packages/sisyphus/dist/cli.js --help
          ./packages/sisyphus/dist/cli.js --version

      - name: Test Atlas CLI
        run: |
          chmod +x packages/atlas/dist/cli.js
          ./packages/atlas/dist/cli.js --help
          ./packages/atlas/dist/cli.js --version

  release-check:
    name: Release Check
    if: github.event_name == 'pull_request'
    runs-on: r5n-m2-ultra
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Checkout submodules
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: "url.https://github.com/.insteadOf"
          GIT_CONFIG_VALUE_0: "git@github.com:"
        run: git submodule update --init --recursive

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for pending releases
        run: bun release:check
