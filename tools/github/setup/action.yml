name: Setup Monorepo
description: Prepare and install everything for the monorepo
inputs:
  bun:
    description: Install Bun in the job's temporary directory
    required: false
    default: "true"
  bun-version:
    description: Bun version to install
    required: false
    default: latest
  install-retry:
    description: Install dependencies with retry
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: 🌭 Setup bun
      if: inputs.bun == 'true'
      shell: bash
      env:
        BUN_INSTALL: ${{ runner.temp }}/bun
        BUN_VERSION: ${{ inputs.bun-version }}
      run: |
        set -euo pipefail
        export PATH="$BUN_INSTALL/bin:$PATH"
        installer="$RUNNER_TEMP/install-bun.sh"
        curl --fail --silent --show-error --location https://bun.sh/install --output "$installer"
        if [ "$BUN_VERSION" = "latest" ]; then
          bash "$installer"
        else
          bash "$installer" "bun-v${BUN_VERSION#bun-v}"
        fi
        "$BUN_INSTALL/bin/bun" --version
        printf '%s\n' "$BUN_INSTALL/bin" >> "$GITHUB_PATH"

    - name: 📦 Install dependencies
      if: inputs.install-retry == 'true'
      uses: nick-fields/retry@v4
      with:
        timeout_minutes: 5
        max_attempts: 3
        retry_wait_seconds: 1
        retry_on: error
        command: bun install --frozen-lockfile

    - name: 📦 Install dependencies
      if: inputs.install-retry == 'false'
      shell: bash
      run: bun install --frozen-lockfile
